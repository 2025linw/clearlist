name: API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api-ci-cd.yml"
      - "apps/api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "!apps/api/**/*.md"
  pull_request:
    paths:
      - ".github/workflows/api-ci-cd.yml"
      - "apps/api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "!apps/api/**/*.md"

permissions:
  contents: read

concurrency:
  group: api-ci-cd-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI

    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Run check
        run: cargo check --locked -p clearlist-api

      - name: Run clippy
        if: github.event_name != 'pull_request' || github.base_ref != 'main'
        run: cargo clippy -p clearlist-api -- -D warnings

      - name: Run clippy (strict)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: cargo clippy -p clearlist-api -- -D warnings -D clippy::todo -D clippy::unimplemented -D clippy::print_stdout -D clippy::print_stderr

      - name: Run test
        env:
          DATABASE_URL: postgresql://test:test@localhost/testdb
        run: cargo test --locked -p clearlist-api

  build:
    name: Build
    outputs:
      version: ${{ steps.meta.outputs.version }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
      sha: ${{ steps.meta.outputs.sha }}

    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release
        run: cargo build --release --locked -p clearlist-api

      - name: Generate metadata
        id: meta
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "clearlist-api") | .version')

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: clearlist-api
          path: target/release/clearlist-api
          retention-days: 7

  deploy:
    name: CD

    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: clearlist-api
          path: artifact/

      - name: Connect to tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-cd

      - name: Upload binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: artifact/clearlist-api
          strip_components: 1
          target: /tmp/clearlist-api/

      - name: Deploy server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sudo -n ${{ secrets.API_DEPLOY_SCRIPT }} ${{ needs.build.outputs.version }} ${{ needs.build.outputs.timestamp }} ${{ needs.build.outputs.sha }}
