name: API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api-ci-cd.yml"
      - "apps/api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "!apps/api/**/*.md"
  pull_request:
    paths:
      - ".github/workflows/api-ci-cd.yml"
      - "apps/api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "!apps/api/**/*.md"

permissions:
  contents: read

concurrency:
  group: api-ci-cd-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Run check
        run: cargo check --locked -p clearlist-api

      - name: Run clippy
        run: cargo clippy -p clearlist-api -- -D warnings

      - name: Bootstrap database
        env:
          PGHOST: localhost
          PGDATABASE: testdb
          PGUSER: test
          PGPASSWORD: test
        run: |
          psql -v ON_ERROR_STOP=1 -f apps/api/bootstrap_test.sql

      - name: Run test
        env:
          MIGRATION_URL: postgresql://test:test@localhost/testdb
          DATABASE_URL: postgresql://test:test@localhost/testdb
        run: cargo test --locked -p clearlist-api

  build:
    name: Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release
        run: cargo build --release --locked -p clearlist-api

      - name: Generate metadata
        id: meta
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "clearlist-api") | .version')

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create artifact folder
        run: |
          mkdir artifact
          cp -t artifact/ target/release/clearlist-api

      - name: Archive artifacts
        run: tar -czf clearlist-api.tar.gz -C artifact/ .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: clearlist-api
          path: clearlist-api.tar.gz
          retention-days: 7

  deploy:
    name: CD
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: self-hosted

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: clearlist-api
          path: artifact/

      - name: Upload archive
        env:
          SSH_HOST: ${{ secrets.API_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.API_DEPLOY_USER }}
        run: |
          scp artifact/clearlist-api.tar.gz \
            "$SSH_USER@$SSH_HOST:/tmp/clearlist-api/"

      - name: Deploy server
        env:
          SSH_HOST: ${{ secrets.API_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.API_DEPLOY_USER }}
          DEPLOY_SCRIPT: ${{ secrets.API_DEPLOY_SCRIPT }}
          VERSION: ${{ needs.build.outputs.version }}
          TIMESTAMP: ${{ needs.build.outputs.timestamp }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            "$DEPLOY_SCRIPT '$VERSION' '$TIMESTAMP' '$SHA'"
