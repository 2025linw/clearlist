name: Deploy API server deploy script

on:
  pull_request:
    paths:
      - ".github/workflows/api-deploy-script.yml"
      - "scripts/deploy-api.sh"
  workflow_dispatch:

jobs:
  required:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - run: shellcheck scripts/deploy-api.sh

  deploy-script:
    name: Deploy script
    if: github.event_name == 'workflow_dispatch'
    needs: required
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Upload script
        env:
          SSH_HOST: ${{ secrets.API_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.API_DEPLOY_USER }}
        run: |
          scp scripts/deploy-api.sh \
            "$SSH_USER@$SSH_HOST:/tmp/clearlist-api/"

      - name: Install deploy script
        env:
          SSH_HOST: ${{ secrets.API_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.API_DEPLOY_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            'mkdir -p /opt/clearlist-api/scripts &&
            install -m 755 /tmp/clearlist-api/deploy-api.sh /opt/clearlist-api/scripts/deploy.sh'
