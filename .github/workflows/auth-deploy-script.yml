name: Deploy auth server deploy script

on:
  pull_request:
    paths:
      - ".github/workflows/auth-deploy-script.yml"
      - "scripts/deploy-auth.sh"
  workflow_dispatch:

jobs:
  required:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - run: shellcheck scripts/deploy-auth.sh

  deploy-script:
    name: Deploy script
    if: github.event_name == 'workflow_dispatch'
    needs: required
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Upload script
        env:
          SSH_HOST: ${{ secrets.AUTH_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.AUTH_DEPLOY_USER }}
        run: |
          scp scripts/deploy-auth.sh \
            "$SSH_USER@$SSH_HOST:/tmp/clearlist-auth/"

      - name: Install deploy script
        env:
          SSH_HOST: ${{ secrets.AUTH_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.AUTH_DEPLOY_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            'mkdir -p /opt/clearlist-auth/scripts &&
            install -m 755 /tmp/clearlist-auth/deploy-auth.sh /opt/clearlist-auth/scripts/deploy.sh'
