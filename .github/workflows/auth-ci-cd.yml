name: Auth CI/CD

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auth-ci-cd.yml"
      - "apps/auth/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "!apps/auth/**/*.md"
  pull_request:
    paths:
      - ".github/workflows/auth-ci-cd.yml"
      - "apps/auth/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "!apps/auth/**/*.md"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auth-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-pr:
    runs-on: ubuntu-latest

    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          prs=$(gh api \
            repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            -H "Accept: application/vnd.github+json" \
            --jq '[.[] | select(.state == "open")] | length')

          if [ "$prs" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI

    needs: check-pr
    if: needs.check-pr.outputs.should_run == 'true'

    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Run install
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm auth:lint

      - name: Bootstrap database
        env:
          PGHOST: localhost
          PGDATABASE: testdb
          PGUSER: test
          PGPASSWORD: test
        run: |
          psql -v ON_ERROR_STOP=1 -f bootstrap_test.sql

      - name: Run test
        run: pnpm auth:test

  build:
    name: Build

    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Run install
        run: pnpm install --frozen-lockfile

      - name: Build deployment
        run: pnpm auth:build

      - name: Archive deployment
        run: tar -czf clearlist-auth.tar.gz -C build/auth .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: clearlist-auth
          path: clearlist-auth.tar.gz
          retention-days: 7
          include-hidden-files: true

  deploy:
    name: CD

    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: clearlist-auth

      - name: Connect to tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-cd

      - name: Upload deployment
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: clearlist-auth.tar.gz
          target: /tmp/clearlist-auth/

      - name: Deploy server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail

            tar -xzf /tmp/clearlist-auth/clearlist-auth.tar.gz -C /tmp/clearlist-auth/clearlist-auth

            cd ${{ secrets.AUTH_DEPLOY_PATH }}
            rm -rf ./*
            cp -a /tmp/clearlist-auth/clearlist-auth/. .

            node dist/scripts/migrate.js

            sudo -n systemctl restart clearlist-auth.service

            MAX_WAIT=10
            INTERVAL=2

            # Retry until active or timeout
            ELAPSED=0
            while ! systemctl is-active --quiet clearlist-auth.service; do
                sleep $INTERVAL
                ELAPSED=$((ELAPSED + INTERVAL))
                if [ $ELAPSED -ge $MAX_WAIT ]; then
                    echo "Service failed to start after $MAX_WAIT seconds"
                    sudo -n journalctl -u clearlist-auth.service -n 50 --no-pager
                    exit 1
                fi
            done

            rm -rf /tmp/clearlist-auth
