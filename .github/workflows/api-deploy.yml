name: API Deploy

concurrency:
  group: api-deploy
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["API CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release
        run: cargo build --release -p clearlist-api

      - name: Connect tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-cd

      - name: Upload binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: ./target/release/clearlist-api
          strip_components: 3
          target: /tmp/clearlist-api/

      - name: Deploy server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail

            cd ${{ secrets.DEPLOY_PATH }}
            mv /tmp/clearlist-api/clearlist-api .

            ./clearlist-api migrate

            sudo -n systemctl restart clearlist-api.service

            MAX_WAIT=10
            INTERVAL=2

            # Retry until active or timeout
            ELAPSED=0
            while ! systemctl is-active --quiet clearlist-api.service; do
                sleep $INTERVAL
                ELAPSED=$((ELAPSED + INTERVAL))
                if [ $ELAPSED -ge $MAX_WAIT ]; then
                    echo "Service failed to start after $MAX_WAIT seconds"
                    sudo journalctl -u clearlist-api.service -n 50 --no-pager
                    exit 1
                fi
            done
