name: API CI

on:
  push:
    branches:
      - main
      - deploy
    paths:
      - ".github/workflows/api-ci.yml"
      - "apps/api/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "apps/api/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cargo check
        run: cargo check -p clearlist-api

      - name: Cargo clippy
        run: cargo clippy -p clearlist-api -- -D warnings

      - name: Bootstrap database
        env:
          PGHOST: localhost
          PGDATABASE: testdb
          PGUSER: test
          PGPASSWORD: test
        run: |
          psql -v ON_ERROR_STOP=1 -f setup_dev.sql

      - name: Cargo test
        run: cargo test -p clearlist-api
